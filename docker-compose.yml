services:
  frontend:
    build:
      context: ./client
    container_name: ebookstore-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    networks:
      - ebookstore-network

  backend:
    build:
      context: ./server
    container_name: ebookstore-backend
    ports:
      - "8080:8080"
    environment:
      - DSN=postgres://yogesh:yogesh@db:5432/ebookstore?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebookstore-network
  db:
    image: postgres:16-alpine
    container_name: ebookstore-db
    environment:
      POSTGRES_USER: yogesh
      POSTGRES_PASSWORD: yogesh
      POSTGRES_DB: ebookstore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U yogesh -d ebookstore"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:


networks:
  ebookstore-network:
    driver: bridge