services:
  frontend:
    build:
      context: ./client
    container_name: ebookstore-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    networks:
      - ebookstore-network

  backend:
    build:
      context: ./server
    container_name: ebookstore-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DSN=postgres://yogesh:yogesh@db:5432/ebookstore?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ebookstore-network
  db:
    image: postgres:16-alpine
    container_name: ebookstore-db
    restart: always
    environment:
      POSTGRES_USER: yogesh
      POSTGRES_PASSWORD: yogesh
      POSTGRES_DB: ebookstore
    networks:
      - ebookstore-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yogesh -d ebookstore"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    container_name: ebookstore-redis
    restart: always
    networks:
      - ebookstore-network
volumes:
  postgres_data:


networks:
  ebookstore-network:
    driver: bridge