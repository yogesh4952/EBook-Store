services:
  db:
    image: postgres:16-alpine
    container_name: ebookstore-db
    environment:
      POSTGRES_USER: yogesh
      POSTGRES_PASSWORD: yogesh
      POSTGRES_DB: ebookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs all *.sql files in ./migrations on first container start
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: