basePath: /api
definitions:
  github_com_yogesh4952_ebookstore_internal_address_models.UserAddress:
    properties:
      city:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      delivery_address:
        type: string
      id:
        type: integer
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_user_models.User'
      user_id:
        type: integer
    required:
    - city
    - delivery_address
    - user_id
    type: object
  github_com_yogesh4952_ebookstore_internal_auth_models.RegisterPayload:
    properties:
      age:
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      role:
        $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_user_models.Role'
    required:
    - age
    - email
    - first_name
    - last_name
    - role
    type: object
  github_com_yogesh4952_ebookstore_internal_book_models.PublishBookPayload:
    properties:
      author_name:
        type: string
      category:
        type: string
      cover_page_url:
        type: string
      genre:
        type: string
      pages:
        minimum: 10
        type: integer
      price:
        minimum: 1000
        type: integer
      publication:
        type: string
      seller_id:
        type: integer
      title:
        maxLength: 60
        minLength: 2
        type: string
      units:
        minimum: 0
        type: integer
    required:
    - author_name
    - category
    - genre
    - pages
    - price
    - publication
    - title
    - units
    type: object
  github_com_yogesh4952_ebookstore_internal_book_models.UpdateBookPayload:
    properties:
      author_name:
        type: string
      book_id:
        type: integer
      category:
        type: string
      cover_page_url:
        type: string
      genre:
        type: string
      pages:
        minimum: 10
        type: integer
      price:
        minimum: 1000
        type: integer
      publication:
        type: string
      seller_id:
        type: integer
      title:
        maxLength: 60
        minLength: 2
        type: string
      units:
        minimum: 0
        type: integer
    required:
    - book_id
    - seller_id
    type: object
  github_com_yogesh4952_ebookstore_internal_order_models.OrderItemRequest:
    properties:
      book_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
      seller_id:
        type: integer
    required:
    - book_id
    - quantity
    - seller_id
    type: object
  github_com_yogesh4952_ebookstore_internal_order_models.PaymentMethod:
    enum:
    - COD
    - ESEWA
    type: string
    x-enum-varnames:
    - PayementCOD
    - PayementEsewa
  github_com_yogesh4952_ebookstore_internal_order_models.PlaceOrderPayload:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_order_models.OrderItemRequest'
        minItems: 1
        type: array
      payment_method:
        $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_order_models.PaymentMethod'
      user_address_id:
        type: integer
    required:
    - items
    - payment_method
    - user_address_id
    type: object
  github_com_yogesh4952_ebookstore_internal_user_models.Role:
    enum:
    - admin
    - customer
    - seller
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleCustomer
    - Roleseller
  github_com_yogesh4952_ebookstore_internal_user_models.User:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      phone_number:
        type: string
      role:
        $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_user_models.Role'
      updatedAt:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_auth_handler.LoginPayload:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  internal_auth_handler.SendOTPRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for the EBook Store platform
  title: EBook Store API
  version: "1.0"
paths:
  /address/add-address:
    post:
      consumes:
      - application/json
      description: Add a shipping address for the authenticated user
      parameters:
      - description: Address data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_address_models.UserAddress'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add a new address
      tags:
      - addresses
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Email and OTP
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_auth_handler.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login with email and OTP
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account (customer or seller)
      parameters:
      - description: Registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_auth_models.RegisterPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/send-otp:
    post:
      consumes:
      - application/json
      description: Send a one-time password to the user's email for verification
      parameters:
      - description: Email address
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_auth_handler.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Send OTP to email
      tags:
      - auth
  /book/list-books:
    get:
      description: Get a paginated list of books
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: List all books
      tags:
      - books
  /book/publish-book:
    post:
      consumes:
      - application/json
      description: Seller creates a new book listing
      parameters:
      - description: Book data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_book_models.PublishBookPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Publish a new book
      tags:
      - books
  /book/update-book:
    patch:
      consumes:
      - application/json
      description: Update book details (owner only)
      parameters:
      - description: Updated book data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_book_models.UpdateBookPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an existing book
      tags:
      - books
  /order/place-order:
    post:
      consumes:
      - application/json
      description: Create a new order with items, payment method, and shipping address
      parameters:
      - description: Order data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_yogesh4952_ebookstore_internal_order_models.PlaceOrderPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Place a new order
      tags:
      - orders
  /users:
    get:
      description: Get all registered users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
